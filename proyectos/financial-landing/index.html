<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestorVault | Análisis Fundamental de Acciones</title>
  <meta name="description" content="Plataforma de análisis fundamental de acciones, portafolio de inversión y métricas de mercado.">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; frame-ancestors 'none';">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">Investor<span>Vault</span></div>
      
      <div class="search-container">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Buscar por símbolo o nombre (ej. AAPL, Tesla)..." autocomplete="off">
        <div id="search-results" class="search-results"></div>
      </div>
      
      <nav class="nav-links">
        <button class="nav-link" data-view="home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Inicio</span>
        </button>
        <button class="nav-link" data-view="favorites">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>Favoritos</span>
        </button>
        <button class="nav-link" data-view="portfolio">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          <span>Portafolio</span>
        </button>
        <button class="btn-icon" id="btn-config" title="Configuración">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Indices -->
    <div id="indices-container" class="indices-grid">
      <!-- Indices will render here -->
    </div>

    <!-- Views -->
    <div id="stock-detail-view" class="view active">
      <!-- Hero/Chart/Metrics render here -->
    </div>

    <div id="favorites-view" class="view">
      <!-- Favorites render here -->
    </div>

    <div id="portfolio-view" class="view">
      <!-- Portfolio render here -->
    </div>

  </main>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Config Modal -->
  <div id="config-modal" class="modal-overlay">
    <div class="modal">
      <h2>Configuración de API</h2>
      <p>InvestorVault requiere una clave de API gratuita de <a href="https://financialmodelingprep.com/developer/docs" target="_blank" style="text-decoration:underline">Financial Modeling Prep</a> para obtener datos en tiempo real.</p>
      
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="api-key-input" style="color:var(--gold-primary)">API Key FMP</label>
        <input type="text" id="api-key-input" placeholder="Pega tu clave aquí...">
      </div>
      
      <div class="modal-actions">
        <button id="btn-cancel-key" class="btn btn-outline">Cancelar</button>
        <button id="btn-save-key" class="btn btn-gold">Guardar Configuración</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
